services:
  db:
    image: timescale/timescaledb:latest-pg15
    volumes:
      - postgres_data:/var/lib/postgresql/data
    env_file: .env
    environment:
      - POSTGRES_DB=${DB_NAME:-sysroar}
      - POSTGRES_USER=${DB_USER:-sysroar_user}
      - POSTGRES_PASSWORD=${DB_PASSWORD:-sysroar_password}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-sysroar_user} -d ${DB_NAME:-sysroar}"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  mailpit:
    image: axllent/mailpit:latest
    ports:
      - "127.0.0.1:8025:8025"
      - "127.0.0.1:1025:1025"
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:8025/api/v1/info"]
      interval: 5s
      timeout: 5s
      retries: 5

  web:
    build: .
    volumes:
      - .:/app
    env_file: .env
    environment:
      - DEBUG=${DEBUG:-True}
      - DATABASE_URL=postgres://${DB_USER:-sysroar_user}:${DB_PASSWORD:-sysroar_password}@db:5432/${DB_NAME:-sysroar}
      - REDIS_URL=${REDIS_URL:-redis://redis:6379/0}
      - CELERY_BROKER_URL=${CELERY_BROKER_URL:-redis://redis:6379/1}
      - LOG_BACKEND=${LOG_BACKEND:-none}
      - LOKI_URL=${LOKI_URL:-http://loki:3100}
      - ELASTICSEARCH_URL=${ELASTICSEARCH_URL:-http://elasticsearch:9200}
      - LOGSTASH_HOST=logstash
      - LOGSTASH_PORT=5044
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:8000/healthz"]
      interval: 10s
      timeout: 5s
      retries: 5
    command: python manage.py runserver 0.0.0.0:8000

  ingest_consumer:
    build: .
    volumes:
      - .:/app
    env_file: .env
    environment:
      - DATABASE_URL=postgres://${DB_USER:-sysroar_user}:${DB_PASSWORD:-sysroar_password}@db:5432/${DB_NAME:-sysroar}
      - REDIS_URL=${REDIS_URL:-redis://redis:6379/0}
      - CELERY_BROKER_URL=${CELERY_BROKER_URL:-redis://redis:6379/1}
      - LOG_BACKEND=${LOG_BACKEND:-none}
      - LOKI_URL=${LOKI_URL:-http://loki:3100}
      - ELASTICSEARCH_URL=${ELASTICSEARCH_URL:-http://elasticsearch:9200}
      - LOGSTASH_HOST=logstash
      - LOGSTASH_PORT=5044
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: python manage.py run_ingest_consumer

  celery_worker:
    build: .
    volumes:
      - .:/app
    env_file: .env
    environment:
      - DATABASE_URL=postgres://${DB_USER:-sysroar_user}:${DB_PASSWORD:-sysroar_password}@db:5432/${DB_NAME:-sysroar}
      - REDIS_URL=${REDIS_URL:-redis://redis:6379/0}
      - CELERY_BROKER_URL=${CELERY_BROKER_URL:-redis://redis:6379/1}
      - LOG_BACKEND=${LOG_BACKEND:-none}
      - LOKI_URL=${LOKI_URL:-http://loki:3100}
      - ELASTICSEARCH_URL=${ELASTICSEARCH_URL:-http://elasticsearch:9200}
      - LOGSTASH_HOST=logstash
      - LOGSTASH_PORT=5044
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: celery -A config worker --loglevel=info

  celery_beat:
    build: .
    volumes:
      - .:/app
    env_file: .env
    environment:
      - DATABASE_URL=postgres://${DB_USER:-sysroar_user}:${DB_PASSWORD:-sysroar_password}@db:5432/${DB_NAME:-sysroar}
      - REDIS_URL=${REDIS_URL:-redis://redis:6379/0}
      - CELERY_BROKER_URL=${CELERY_BROKER_URL:-redis://redis:6379/1}
      - LOG_BACKEND=${LOG_BACKEND:-none}
      - LOKI_URL=${LOKI_URL:-http://loki:3100}
      - ELASTICSEARCH_URL=${ELASTICSEARCH_URL:-http://elasticsearch:9200}
      - LOGSTASH_HOST=logstash
      - LOGSTASH_PORT=5044
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: celery -A config beat --loglevel=info

  loki:
    image: grafana/loki:3.1.1
    profiles:
      - logs
    command: -config.file=/etc/loki/local-config.yaml
    volumes:
      - ./deploy/loki/loki-config.yml:/etc/loki/local-config.yaml:ro
      - loki_data:/loki
    ports:
      - "127.0.0.1:3100:3100"
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:3100/ready || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10

  vector:
    image: timberio/vector:0.41.1-alpine
    profiles:
      - logs
    command: --config /etc/vector/vector.toml
    volumes:
      - ./deploy/vector/vector.toml:/etc/vector/vector.toml:ro
    ports:
      - "127.0.0.1:8686:8686"
      - "127.0.0.1:5140:5140"
    depends_on:
      loki:
        condition: service_healthy

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.11.1
    profiles:
      - elk
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - "ES_JAVA_OPTS=-Xms512m -Xmx512m"
    ports:
      - "127.0.0.1:9200:9200"
    volumes:
      - es_data:/usr/share/elasticsearch/data

  logstash:
    image: docker.elastic.co/logstash/logstash:8.11.1
    profiles:
      - elk
    volumes:
      - ./logstash/pipeline:/usr/share/logstash/pipeline:ro
    ports:
      - "127.0.0.1:5044:5044"
      - "127.0.0.1:5000:5000/tcp"
      - "127.0.0.1:5000:5000/udp"
    environment:
      - LS_JAVA_OPTS=-Xms256m -Xmx256m
    depends_on:
      - elasticsearch

  kibana:
    image: docker.elastic.co/kibana/kibana:8.11.1
    profiles:
      - elk
    ports:
      - "127.0.0.1:5601:5601"
    depends_on:
      - elasticsearch

volumes:
  postgres_data:
  es_data:
  loki_data:
