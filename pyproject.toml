[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings"
python_files = ["tests.py", "tests_*.py", "test_*.py"]
testpaths = ["accounts", "agent", "config", "monitoring", "telemetry"]
asyncio_default_fixture_loop_scope = "function"

[tool.ruff]
target-version = "py314"
line-length = 120
exclude = [
    "*/migrations/*",
    "frontend/*",
    ".git",
]

[tool.ruff.lint]
select = ["E", "F", "B", "S"]
ignore = ["E402"]

[tool.ruff.lint.per-file-ignores]
"**/tests*.py" = ["S101", "S105", "S106", "S603"]
"agent/test_*.py" = ["S101", "S105", "S106"]
"config/settings.py" = ["S105"]
