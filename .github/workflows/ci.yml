name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      db:
        image: timescale/timescaledb:latest-pg15
        env:
          POSTGRES_DB: sysroar
          POSTGRES_USER: sysroar_user
          POSTGRES_PASSWORD: sysroar_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U sysroar_user -d sysroar"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DEBUG: "True"
      SECRET_KEY: "ci-test-secret-key"
      ALLOWED_HOSTS: "localhost,127.0.0.1"
      DATABASE_URL: "postgres://sysroar_user:sysroar_password@127.0.0.1:5432/sysroar"
      REDIS_URL: "redis://127.0.0.1:6379/0"
      CELERY_BROKER_URL: "redis://127.0.0.1:6379/1"
      CELERY_RESULT_BACKEND: "redis://127.0.0.1:6379/2"
      EMAIL_BACKEND: "django.core.mail.backends.locmem.EmailBackend"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
      - name: Lint with Ruff
        run: ruff check .
      - name: Run pytest
        run: pytest

  agent:
    runs-on: ubuntu-latest
    services:
      db:
        image: timescale/timescaledb:latest-pg15
        env:
          POSTGRES_DB: sysroar
          POSTGRES_USER: sysroar_user
          POSTGRES_PASSWORD: sysroar_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U sysroar_user -d sysroar"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DEBUG: "True"
      SECRET_KEY: "ci-test-secret-key"
      ALLOWED_HOSTS: "localhost,127.0.0.1"
      DATABASE_URL: "postgres://sysroar_user:sysroar_password@127.0.0.1:5432/sysroar"
      REDIS_URL: "redis://127.0.0.1:6379/0"
      CELERY_BROKER_URL: "redis://127.0.0.1:6379/1"
      CELERY_RESULT_BACKEND: "redis://127.0.0.1:6379/2"
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: agent
      - name: Run cargo clippy
        working-directory: agent
        run: cargo clippy --all-targets -- -D warnings
      - name: Run cargo test
        working-directory: agent
        run: cargo test
      - name: Build agent binary
        working-directory: agent
        run: cargo build --bin sysroar-agent
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Install backend for agent integration test
        run: pip install -r requirements.txt
      - name: Run Rust agent integration test against live backend
        run: |
          python manage.py migrate --noinput
          ENROLL_TOKEN=$(python -c "
          import os, django
          os.environ.setdefault('DJANGO_SETTINGS_MODULE', 'config.settings')
          django.setup()
          from accounts.models import Company
          from monitoring.models import EnrollmentToken
          c = Company.objects.create(name='CI Agent Co')
          _, raw = EnrollmentToken.generate(company=c, name='ci-enroll', max_uses=1, expires_in_hours=1)
          print(raw)
          ")
          daphne -b 127.0.0.1 -p 8000 config.asgi:application &
          SERVER_PID=$!
          trap "kill $SERVER_PID || true" EXIT
          for i in $(seq 1 30); do
            if curl -sf http://127.0.0.1:8000/healthz >/dev/null; then break; fi
            sleep 0.5
          done
          read -r AGENT_KEY SERVER_ID < <(python -c "
          import requests
          r = requests.post(
              'http://127.0.0.1:8000/api/telemetry/enroll/',
              json={'enrollment_token': '$ENROLL_TOKEN', 'name': 'ci-host', 'agent_version': '0.1.0'},
              timeout=10,
          )
          assert r.status_code == 201, (r.status_code, r.text)
          data = r.json()
          blocked = requests.get(
              'http://127.0.0.1:8000/api/monitoring/servers/',
              headers={'Authorization': f'AgentKey {data[\"agent_key\"]}'},
              timeout=10,
          )
          assert blocked.status_code == 401, blocked.status_code
          print(data['agent_key'], data['server_id'])
          ")
          SYSROAR_API_BASE_URL=http://127.0.0.1:8000 \
          SYSROAR_AGENT_KEY="$AGENT_KEY" \
          SYSROAR_SERVER_ID="$SERVER_ID" \
          SYSROAR_BUFFER_PATH=/tmp/ci-agent-buffer.db \
            agent/target/debug/sysroar-agent --once
          python manage.py run_ingest_consumer --once --block-ms 200
          python -c "
          import os, django
          os.environ.setdefault('DJANGO_SETTINGS_MODULE', 'config.settings')
          django.setup()
          from monitoring.models import Server
          from telemetry.models import MetricLog
          s = Server.unscoped.get(id='$SERVER_ID')
          assert s.agent_version == '0.1.0', s.agent_version
          assert MetricLog.unscoped.filter(server=s).count() == 1
          print('Rust agent integration test passed')
          "

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend dependencies
        run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Run Vitest
        run: npm test
      - name: Build bundle
        run: npm run build

  e2e:
    runs-on: ubuntu-latest
    services:
      db:
        image: timescale/timescaledb:latest-pg15
        env:
          POSTGRES_DB: sysroar
          POSTGRES_USER: sysroar_user
          POSTGRES_PASSWORD: sysroar_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U sysroar_user -d sysroar"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DEBUG: "True"
      SECRET_KEY: "ci-e2e-secret-key"
      ALLOWED_HOSTS: "localhost,127.0.0.1"
      DATABASE_URL: "postgres://sysroar_user:sysroar_password@127.0.0.1:5432/sysroar"
      REDIS_URL: "redis://127.0.0.1:6379/0"
      CELERY_BROKER_URL: "redis://127.0.0.1:6379/1"
      CELERY_RESULT_BACKEND: "redis://127.0.0.1:6379/2"
      EMAIL_BACKEND: "django.core.mail.backends.console.EmailBackend"
      FRONTEND_URL: "http://localhost:5173"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: requirements.txt
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install backend dependencies
        run: pip install -r requirements.txt
      - name: Install frontend dependencies and Chromium
        working-directory: frontend
        run: |
          npm ci
          npx playwright install chromium --with-deps
      - name: Run Playwright Phase 3 E2E suite against live stack
        run: |
          python manage.py migrate --noinput
          daphne -b 127.0.0.1 -p 8000 config.asgi:application &
          WEB_PID=$!
          python manage.py run_ingest_consumer --block-ms 250 &
          CONSUMER_PID=$!
          trap "kill $WEB_PID $CONSUMER_PID || true" EXIT
          for i in $(seq 1 30); do
            if curl -sf http://127.0.0.1:8000/healthz >/dev/null; then break; fi
            sleep 0.5
          done
          npm --prefix frontend run test:e2e

  e2e:
    runs-on: ubuntu-latest
    services:
      db:
        image: timescale/timescaledb:latest-pg15
        env:
          POSTGRES_DB: sysroar
          POSTGRES_USER: sysroar_user
          POSTGRES_PASSWORD: sysroar_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U sysroar_user -d sysroar"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DEBUG: "True"
      SECRET_KEY: "ci-e2e-secret-key"
      ALLOWED_HOSTS: "localhost,127.0.0.1"
      DATABASE_URL: "postgres://sysroar_user:sysroar_password@127.0.0.1:5432/sysroar"
      REDIS_URL: "redis://127.0.0.1:6379/0"
      CELERY_BROKER_URL: "redis://127.0.0.1:6379/1"
      CELERY_RESULT_BACKEND: "redis://127.0.0.1:6379/2"
      EMAIL_BACKEND: "django.core.mail.backends.console.EmailBackend"
      FRONTEND_URL: "http://localhost:5173"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: requirements.txt
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install backend dependencies
        run: pip install -r requirements.txt
      - name: Install frontend dependencies and Chromium
        working-directory: frontend
        run: |
          npm ci
          npx playwright install chromium --with-deps
      - name: Run Playwright E2E against live backend
        run: |
          python manage.py migrate --noinput
          daphne -b 127.0.0.1 -p 8000 config.asgi:application &
          SERVER_PID=$!
          python manage.py run_ingest_consumer --block-ms 250 &
          CONSUMER_PID=$!
          trap "kill $SERVER_PID $CONSUMER_PID || true" EXIT
          for i in $(seq 1 30); do
            if curl -sf http://127.0.0.1:8000/healthz >/dev/null; then break; fi
            sleep 0.5
          done
          cd frontend && PLAYWRIGHT_API_URL=http://127.0.0.1:8000 npm run test:e2e
