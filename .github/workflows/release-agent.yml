name: Release Agent

on:
  push:
    tags:
      - "agent-v*"

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-musl
            os: ubuntu-latest
            bin: sysroar-agent
          - target: aarch64-unknown-linux-musl
            os: ubuntu-latest
            bin: sysroar-agent
            cross: true
          - target: x86_64-pc-windows-msvc
            os: windows-latest
            bin: sysroar-agent.exe
          - target: x86_64-apple-darwin
            os: macos-latest
            bin: sysroar-agent
          - target: aarch64-apple-darwin
            os: macos-latest
            bin: sysroar-agent
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Install musl tools
        if: matrix.target == 'x86_64-unknown-linux-musl'
        run: sudo apt-get update && sudo apt-get install -y musl-tools
      - name: Install aarch64 musl cross linker
        if: matrix.cross
        run: |
          sudo apt-get update && sudo apt-get install -y gcc-aarch64-linux-gnu musl-tools
          echo "CARGO_TARGET_AARCH64_UNKNOWN_LINUX_MUSL_LINKER=aarch64-linux-gnu-gcc" >> $GITHUB_ENV
      - name: Build release binary
        working-directory: agent
        run: cargo build --release --target ${{ matrix.target }}
      - name: Package artifact and checksum (Unix)
        if: runner.os != 'Windows'
        working-directory: agent/target/${{ matrix.target }}/release
        run: |
          tar -czf sysroar-agent-${{ matrix.target }}.tar.gz ${{ matrix.bin }}
          sha256sum sysroar-agent-${{ matrix.target }}.tar.gz > sysroar-agent-${{ matrix.target }}.tar.gz.sha256
      - name: Package artifact and checksum (Windows)
        if: runner.os == 'Windows'
        working-directory: agent/target/${{ matrix.target }}/release
        shell: pwsh
        run: |
          Compress-Archive -Path ${{ matrix.bin }} -DestinationPath sysroar-agent-${{ matrix.target }}.zip
          $hash = (Get-FileHash sysroar-agent-${{ matrix.target }}.zip -Algorithm SHA256).Hash.ToLower()
          "$hash  sysroar-agent-${{ matrix.target }}.zip" | Out-File -Encoding ascii sysroar-agent-${{ matrix.target }}.zip.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: agent-${{ matrix.target }}
          path: |
            agent/target/${{ matrix.target }}/release/sysroar-agent-${{ matrix.target }}.*

  publish:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp scripts/install.sh artifacts/install.sh
          cp scripts/install.ps1 artifacts/install.ps1
          gh release create "${{ github.ref_name }}" artifacts/* --title "${{ github.ref_name }}" --generate-notes
