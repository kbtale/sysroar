scrape_configs:
  - job_name: sysroar
    scrape_interval: 15s
    scrape_timeout: 10s
    metrics_path: /metrics
    scheme: https
    authorization:
      type: Bearer
      credentials_file: /etc/prometheus/secrets/sysroar_metrics_token
    static_configs:
      - targets:
          - monitor.example.com
