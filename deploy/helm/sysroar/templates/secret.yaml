{{- if not .Values.secrets.existingSecret }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "sysroar.fullname" . }}-secrets
  labels:
    {{- include "sysroar.labels" . | nindent 4 }}
type: Opaque
stringData:
  SECRET_KEY: {{ .Values.secrets.secretKey | quote }}
  DATABASE_URL: {{ .Values.secrets.databaseUrl | quote }}
  REDIS_URL: {{ .Values.secrets.redisUrl | quote }}
  CELERY_BROKER_URL: {{ .Values.secrets.celeryBrokerUrl | quote }}
  CELERY_RESULT_BACKEND: {{ .Values.secrets.celeryResultBackend | quote }}
  METRICS_AUTH_TOKEN: {{ .Values.secrets.metricsAuthToken | quote }}
  EMAIL_HOST_USER: {{ .Values.secrets.emailHostUser | quote }}
  EMAIL_HOST_PASSWORD: {{ .Values.secrets.emailHostPassword | quote }}
{{- end }}
