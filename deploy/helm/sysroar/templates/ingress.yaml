{{- if .Values.ingress.enabled }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "sysroar.fullname" . }}
  labels:
    {{- include "sysroar.labels" . | nindent 4 }}
  {{- with .Values.ingress.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  {{- if .Values.ingress.className }}
  ingressClassName: {{ .Values.ingress.className }}
  {{- end }}
  {{- if .Values.ingress.tls.enabled }}
  tls:
    - hosts:
        - {{ .Values.config.domain }}
      secretName: {{ .Values.ingress.tls.secretName }}
  {{- end }}
  rules:
    - host: {{ .Values.config.domain }}
      http:
        paths:
          - path: /ws
            pathType: Prefix
            backend:
              service:
                name: {{ include "sysroar.fullname" . }}-ws
                port:
                  number: 8001
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: {{ include "sysroar.fullname" . }}-web
                port:
                  number: 8000
          - path: /healthz
            pathType: Exact
            backend:
              service:
                name: {{ include "sysroar.fullname" . }}-web
                port:
                  number: 8000
          - path: /readyz
            pathType: Exact
            backend:
              service:
                name: {{ include "sysroar.fullname" . }}-web
                port:
                  number: 8000
          - path: /metrics
            pathType: Exact
            backend:
              service:
                name: {{ include "sysroar.fullname" . }}-web
                port:
                  number: 8000
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ include "sysroar.fullname" . }}-frontend
                port:
                  number: 80
{{- end }}
