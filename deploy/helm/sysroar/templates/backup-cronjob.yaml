{{- if .Values.backup.enabled }}
apiVersion: batch/v1
kind: CronJob
metadata:
  name: {{ include "sysroar.fullname" . }}-db-backup
  labels:
    {{- include "sysroar.labels" . | nindent 4 }}
    app.kubernetes.io/component: backup
spec:
  schedule: {{ .Values.backup.schedule | quote }}
  concurrencyPolicy: Forbid
  jobTemplate:
    spec:
      template:
        spec:
          restartPolicy: OnFailure
          containers:
            - name: pg-dump
              image: {{ .Values.backup.image }}
              command:
                - /bin/sh
                - -ec
                - |
                  TS="$(date -u +%Y%m%dT%H%M%SZ)"
                  pg_dump "$DATABASE_URL" --format=custom --compress=9 --no-owner --file="/backups/sysroar-${TS}.dump"
                  sha256sum "/backups/sysroar-${TS}.dump" > "/backups/sysroar-${TS}.dump.sha256"
                  find /backups -type f -name 'sysroar-*.dump*' -mtime +{{ .Values.backup.retentionDays }} -delete
              envFrom:
                - secretRef:
                    name: {{ include "sysroar.secretName" . }}
              volumeMounts:
                - name: backups
                  mountPath: /backups
          volumes:
            - name: backups
              persistentVolumeClaim:
                claimName: {{ .Values.backup.pvcName }}
{{- end }}
