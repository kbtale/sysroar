apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "sysroar.fullname" . }}-web
  labels:
    {{- include "sysroar.labels" . | nindent 4 }}
    app.kubernetes.io/component: web
spec:
  replicas: {{ .Values.replicas.web }}
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ include "sysroar.name" . }}
      app.kubernetes.io/instance: {{ .Release.Name }}
      app.kubernetes.io/component: web
  template:
    metadata:
      labels:
        {{- include "sysroar.labels" . | nindent 8 }}
        app.kubernetes.io/component: web
    spec:
      containers:
        - name: web
          image: "{{ .Values.image.backend.repository }}:{{ .Values.image.backend.tag }}"
          imagePullPolicy: {{ .Values.image.backend.pullPolicy }}
          command:
            - gunicorn
            - config.asgi:application
            - -k
            - uvicorn_worker.UvicornWorker
            - --bind
            - 0.0.0.0:8000
            - --workers
            - {{ .Values.config.webWorkers | quote }}
            - --access-logfile
            - "-"
          ports:
            - name: http
              containerPort: 8000
          envFrom:
            - configMapRef:
                name: {{ include "sysroar.fullname" . }}-config
            - secretRef:
                name: {{ include "sysroar.secretName" . }}
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 15
            periodSeconds: 15
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
          resources:
            {{- toYaml .Values.resources.web | nindent 12 }}
