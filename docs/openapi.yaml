components:
  schemas:
    AgentKey:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        server:
          type: string
          format: uuid
          readOnly: true
        prefix:
          type: string
          readOnly: true
        is_active:
          type: boolean
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
        last_used_at:
          type: string
          format: date-time
          readOnly: true
          nullable: true
        revoked_at:
          type: string
          format: date-time
          readOnly: true
          nullable: true
      required:
      - created_at
      - id
      - is_active
      - last_used_at
      - prefix
      - revoked_at
      - server
    AggregationEnum:
      enum:
      - avg
      - max
      - min
      type: string
      description: |-
        * `avg` - Average
        * `max` - Maximum
        * `min` - Minimum
    AlertRule:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        server:
          type: string
          format: uuid
          nullable: true
        server_name:
          type: string
          nullable: true
          readOnly: true
        scope:
          $ref: '#/components/schemas/AlertRuleScopeEnum'
        tag_filter:
          type: string
          maxLength: 64
        channel:
          type: string
          format: uuid
          nullable: true
        metric_type:
          $ref: '#/components/schemas/MetricTypeEnum'
        operator:
          $ref: '#/components/schemas/OperatorEnum'
        severity:
          $ref: '#/components/schemas/SeverityEnum'
        aggregation:
          $ref: '#/components/schemas/AggregationEnum'
        threshold_value:
          type: number
          format: double
        hysteresis_margin:
          type: number
          format: double
        duration_minutes:
          type: integer
          maximum: 2147483647
          minimum: 0
        is_active:
          type: boolean
        notification_type:
          $ref: '#/components/schemas/NotificationTypeEnum'
        notification_target:
          type: string
          nullable: true
          maxLength: 512
        has_webhook_secret:
          type: boolean
          readOnly: true
      required:
      - has_webhook_secret
      - id
      - metric_type
      - server_name
      - threshold_value
    AlertRuleRequest:
      type: object
      properties:
        server:
          type: string
          format: uuid
          nullable: true
        scope:
          $ref: '#/components/schemas/AlertRuleScopeEnum'
        tag_filter:
          type: string
          maxLength: 64
        channel:
          type: string
          format: uuid
          nullable: true
        metric_type:
          $ref: '#/components/schemas/MetricTypeEnum'
        operator:
          $ref: '#/components/schemas/OperatorEnum'
        severity:
          $ref: '#/components/schemas/SeverityEnum'
        aggregation:
          $ref: '#/components/schemas/AggregationEnum'
        threshold_value:
          type: number
          format: double
        hysteresis_margin:
          type: number
          format: double
        duration_minutes:
          type: integer
          maximum: 2147483647
          minimum: 0
        is_active:
          type: boolean
        notification_type:
          $ref: '#/components/schemas/NotificationTypeEnum'
        notification_target:
          type: string
          nullable: true
          maxLength: 512
        webhook_secret:
          type: string
          writeOnly: true
          maxLength: 255
      required:
      - metric_type
      - threshold_value
    AlertRuleScopeEnum:
      enum:
      - server
      - tag
      - all
      type: string
      description: |-
        * `server` - Server
        * `tag` - Tag
        * `all` - All Servers
    AlertSilence:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        rule:
          type: string
          format: uuid
          nullable: true
        server:
          type: string
          format: uuid
          nullable: true
        reason:
          type: string
          maxLength: 255
        starts_at:
          type: string
          format: date-time
        ends_at:
          type: string
          format: date-time
        created_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - created_at
      - ends_at
      - id
    AlertSilenceRequest:
      type: object
      properties:
        rule:
          type: string
          format: uuid
          nullable: true
        server:
          type: string
          format: uuid
          nullable: true
        reason:
          type: string
          maxLength: 255
        starts_at:
          type: string
          format: date-time
        ends_at:
          type: string
          format: date-time
      required:
      - ends_at
    AuditLog:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        actor:
          type: string
          format: uuid
          readOnly: true
          nullable: true
        actor_username:
          type: string
          readOnly: true
        action:
          type: string
          readOnly: true
        resource_type:
          type: string
          readOnly: true
        resource_id:
          type: string
          readOnly: true
        metadata:
          readOnly: true
        ip_address:
          type: string
          readOnly: true
          nullable: true
        correlation_id:
          type: string
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - action
      - actor
      - actor_username
      - correlation_id
      - created_at
      - id
      - ip_address
      - metadata
      - resource_id
      - resource_type
    ChannelTypeEnum:
      enum:
      - EMAIL
      - WEBHOOK
      - SLACK
      - DISCORD
      - TEAMS
      - TELEGRAM
      - PAGERDUTY
      - OPSGENIE
      - NTFY
      - GOTIFY
      type: string
      description: |-
        * `EMAIL` - Email
        * `WEBHOOK` - Webhook
        * `SLACK` - Slack
        * `DISCORD` - Discord
        * `TEAMS` - Microsoft Teams
        * `TELEGRAM` - Telegram
        * `PAGERDUTY` - PagerDuty
        * `OPSGENIE` - Opsgenie
        * `NTFY` - ntfy
        * `GOTIFY` - Gotify
    CheckTypeEnum:
      enum:
      - http
      - tcp
      - ping
      - dns
      - ssl
      type: string
      description: |-
        * `http` - HTTP / HTTPS
        * `tcp` - TCP Port
        * `ping` - Ping
        * `dns` - DNS Lookup
        * `ssl` - SSL Certificate
    Company:
