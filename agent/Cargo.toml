[package]
name = "sysroar-agent"
version = "0.1.0"
edition = "2021"
license = "GPL-3.0-only"
repository = "https://github.com/kbtale/sysroar"
description = "Lightweight cross-platform telemetry agent for SysRoar"

[dependencies]
chrono = { version = "0.4", features = ["serde"] }
flate2 = "1"
rand = "0.8"
reqwest = { version = "0.12", default-features = false, features = ["json", "gzip", "rustls-tls"] }
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sysinfo = "0.33"
thiserror = "2"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "signal", "sync"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
uuid = { version = "1", features = ["v7", "serde"] }

[target.'cfg(target_os = "linux")'.dependencies]
procfs = "0.17"

[dev-dependencies]
tempfile = "3"
wiremock = "0.6"

[profile.release]
lto = true
strip = true
codegen-units = 1
panic = "abort"

[profile.dist]
inherits = "release"
lto = "thin"
